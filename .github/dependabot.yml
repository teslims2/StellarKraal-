version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend-dependencies:
        patterns:
          - "*"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "backend"
      - "security"
    ignore:
      # db-migrate pinned due to SQLite3 native binding compatibility
      - dependency-name: "db-migrate"
        update-types: ["version-update:semver-major"]
      - dependency-name: "db-migrate-sqlite3"
        update-types: ["version-update:semver-major"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    ignore:
      # Next.js major upgrades require manual migration
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/contracts/stellarkraal"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "smart-contract"
    ignore:
      # soroban-sdk major bumps require contract re-audit
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflow files (.github/workflows/*)
  # Keeps action versions (actions/checkout, actions/setup-node, docker/*, etc.)
  # current so we pick up bug fixes and security patches automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "ci"

  # Docker base image digests — backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "docker"
      - "security"

  # Docker base image digests — frontend
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "teslims2"
    labels:
      - "dependencies"
      - "docker"
      - "security"
