name: Static Site CI

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *" # hourly rebuild
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate status page
        uses: upptime/uptime-monitor@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          UPDATE_SITE: true
