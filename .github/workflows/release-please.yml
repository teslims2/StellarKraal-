name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: node
          changelog-types: |
            [
              {"type":"feat","section":"Added","hidden":false},
              {"type":"fix","section":"Fixed","hidden":false},
              {"type":"security","section":"Security","hidden":false},
              {"type":"deprecate","section":"Deprecated","hidden":false},
              {"type":"remove","section":"Removed","hidden":false},
              {"type":"revert","section":"Removed","hidden":false},
              {"type":"perf","section":"Changed","hidden":false},
              {"type":"refactor","section":"Changed","hidden":false},
              {"type":"docs","section":"Changed","hidden":false},
              {"type":"chore","section":"Changed","hidden":false},
              {"type":"build","section":"Changed","hidden":true},
              {"type":"ci","section":"Changed","hidden":true},
              {"type":"test","section":"Changed","hidden":true}
            ]

  sbom:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -t app-${{ matrix.image }}:sbom ${{ matrix.context }}

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: app-${{ matrix.image }}:sbom
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cyclonedx.json
          artifact-name: sbom-${{ matrix.image }}

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: sbom-${{ matrix.image }}.cyclonedx.json
