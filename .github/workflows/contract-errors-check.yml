name: Validate Contract Errors Documentation

on:
  pull_request:
    paths:
      - "contracts/stellarkraal/src/lib.rs"
      - "docs/api-error-codes.md"
      - "backend/src/utils/sorobanErrors.ts"
      - "scripts/validate-contract-errors-doc.js"
      - ".github/workflows/contract-errors-check.yml"
  push:
    branches: [main]
    paths:
      - "contracts/stellarkraal/src/lib.rs"
      - "docs/api-error-codes.md"
      - "backend/src/utils/sorobanErrors.ts"

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    name: Check Contract Errors Doc Sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-contract-errors-doc.js
