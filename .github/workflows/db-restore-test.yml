name: DB Restore Test

on:
  workflow_run:
    workflows: ["Database Backup"]
    types:
      - completed
  schedule:
    # Monthly restore test: 06:00 UTC on the 1st of each month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  restore-test:
    name: Restore test against test database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: restore_test
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: restore_test
      PGPASSWORD: restore_test
      TARGET_DB: restore_test
      # S3 location of the most recent backup dump
      S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
      S3_BACKUP_KEY: ${{ secrets.S3_BACKUP_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database connectivity
        run: |
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"

      - name: Restore dump from S3
        id: restore
        run: |
          chmod +x scripts/restore-db.sh
          ./scripts/restore-db.sh \
            --s3-bucket "$S3_BACKUP_BUCKET" \
            --s3-key "$S3_BACKUP_KEY" \
            --target-db "$TARGET_DB"

      - name: Validate restored data
        id: validate
        run: |
          set -euo pipefail

          collaterals_count=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$TARGET_DB" -tAc "SELECT COUNT(*) FROM collaterals;")
          loans_count=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$TARGET_DB" -tAc "SELECT COUNT(*) FROM loans;")

          echo "collaterals rows: $collaterals_count"
          echo "loans rows: $loans_count"

          if [ -z "$collaterals_count" ] || [ "$collaterals_count" -le 0 ]; then
            echo "::error::Validation failed: collaterals table is empty after restore"
            exit 1
          fi

          if [ -z "$loans_count" ] || [ "$loans_count" -le 0 ]; then
            echo "::error::Validation failed: loans table is empty after restore"
            exit 1
          fi

          echo "Restore validation passed"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload=$(cat <<EOF
          {
            "text": ":rotating_light: Database restore test FAILED (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Backup integrity or restore procedure may be broken."
          }
          EOF
          )
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Open GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Database restore test failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The automated database restore test failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Please investigate backup integrity and the restore procedure. See `docs/runbooks/database-restore.md`.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident', 'database', 'restore-test'],
            });