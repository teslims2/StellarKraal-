name: Deploy to Staging (ECS Fargate)

# Automates the ECS Fargate deployment that previously ran as a manual step
# after CI passed. Triggers on a successful push to main (i.e. after the
# container-registry workflow builds and pushes the new image), updates the
# ECS task definition with the freshly built image digest, rolls the service
# with a rolling update, and waits for stability before marking success.

on:
  workflow_run:
    workflows:
      - Build and Push to GHCR
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stellarkraal-backend

# Concurrency (issue #1502): group runs by branch/ref. Production/staging
# deploys and Terraform applies are NEVER cancelled (cancel-in-progress:
# false) to prevent partial ECS deploys or partial infrastructure applies
# — a queued run waits for the in-progress one to finish instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when the upstream build succeeded (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Notify Slack — staging deployment started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \":rocket: *Staging deployment started* — ${{ github.repository }}\",
              \"attachments\": [{
                \"color\": \"#439FE0\",
                \"fields\": [
                  {\"title\": \"Environment\",   \"value\": \"staging\",                              \"short\": true},
                  {\"title\": \"Image tag\",      \"value\": \"${IMAGE_REF}\",                        \"short\": true},
                  {\"title\": \"Triggered by\",   \"value\": \"${{ github.actor }}\",                 \"short\": true},
                  {\"title\": \"Workflow run\",   \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\", \"short\": true}
                ]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Resolve image digest
        id: image
        run: |
          # The build workflow tags main pushes with the branch name and a
          # short SHA. Resolve the immutable digest for the main tag so the
          # task definition pins an exact image rather than a mutable tag.
          DIGEST=$(docker buildx imagetools inspect "$BACKEND_IMAGE:main" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$BACKEND_IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image digest
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Record deployment start time
        id: start-time
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Blocks until the service reaches a steady state (rolling update).
          wait-for-service-stability: true

      - name: Notify Slack — staging deployment succeeded
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          DURATION=$(( $(date +%s) - ${{ steps.start-time.outputs.start }} ))
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \":white_check_mark: *Staging deployment succeeded* — ${{ github.repository }}\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Environment\",        \"value\": \"staging\",                              \"short\": true},
                  {\"title\": \"Image digest\",        \"value\": \"${{ steps.image.outputs.digest }}\",   \"short\": true},
                  {\"title\": \"Duration\",            \"value\": \"${DURATION}s\",                        \"short\": true},
                  {\"title\": \"Health check\",        \"value\": \"passed\",                              \"short\": true},
                  {\"title\": \"Workflow run\",        \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\", \"short\": false}
                ]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \":x: *Staging deployment failed* — ${{ github.repository }}\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Environment\",   \"value\": \"staging\",                                    \"short\": true},
                  {\"title\": \"Service\",        \"value\": \"${{ env.ECS_SERVICE }}\",                    \"short\": true},
                  {\"title\": \"Triggered by\",   \"value\": \"${{ github.actor }}\",                       \"short\": true},
                  {\"title\": \"Failed run\",     \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\", \"short\": false}
                ]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"
