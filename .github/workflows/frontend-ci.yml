name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/reusable-node-setup.yml'
      - '.github/workflows/reusable-docker-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/reusable-node-setup.yml'
      - '.github/workflows/reusable-docker-build.yml'

jobs:
  node-setup:
    name: Node setup
    uses: ./.github/workflows/reusable-node-setup.yml
    with:
      working-directory: frontend
      node-version-file: '.nvmrc'

  lint:
    name: Lint
    needs: node-setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

  type-check:
    name: Type Check
    needs: node-setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    needs: build
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
      tags: frontend:ci
      cache-key-suffix: frontend
      push: false
