name: Uptime CI

on:
  schedule:
    - cron: "* * * * *" # every minute
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run Upptime monitors
        uses: upptime/uptime-monitor@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
