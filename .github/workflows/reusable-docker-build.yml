name: Reusable – Docker Build

# Centralises Docker Buildx setup, layer caching, and optional registry push
# so that backend-ci.yml and frontend-ci.yml do not duplicate these steps.
# Closes #1521.

on:
  workflow_call:
    inputs:
      context:
        description: 'Docker build context path (e.g. ./backend)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (defaults to <context>/Dockerfile)'
        required: false
        type: string
        default: ''
      tags:
        description: 'Comma-separated image tags (e.g. backend:ci)'
        required: true
        type: string
      cache-key-suffix:
        description: 'Suffix appended to the cache key to separate backend/frontend caches'
        required: true
        type: string
      push:
        description: 'Whether to push the image to a registry'
        required: false
        type: boolean
        default: false
      registry:
        description: 'Container registry hostname (required when push is true)'
        required: false
        type: string
        default: ''
    secrets:
      registry-username:
        description: 'Registry username (required when push is true)'
        required: false
      registry-password:
        description: 'Registry password or token (required when push is true)'
        required: false

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ inputs.cache-key-suffix }}-${{ hashFiles(format('{0}/Dockerfile', inputs.context), format('{0}/package-lock.json', inputs.context)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ inputs.cache-key-suffix }}-

      - name: Log in to registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
