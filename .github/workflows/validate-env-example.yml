name: Validate env.example

on:
  pull_request:
    paths:
      - "backend/src/config.ts"
      - ".env.example"
      - "scripts/validate-env-example.js"
      - "docs/guides/environment-variables.md"
      - "docker-compose*.yml"
      - ".github/workflows/validate-env-example.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/config.ts"
      - ".env.example"
      - "docker-compose*.yml"

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    name: Check .env.example vs config.ts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-env-example.js
