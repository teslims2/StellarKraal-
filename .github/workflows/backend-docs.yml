name: Backend Docs

on:
  push:
    paths:
      - "backend/src/**/*.ts"
      - "backend/typedoc.json"
  pull_request:
    paths:
      - "backend/src/**/*.ts"
      - "backend/typedoc.json"

# Concurrency (issue #1502): group runs by branch/ref so a new push
# cancels stale, in-progress runs on the same branch (PRs and feature
# branches). Runs on the default branch (main) are never cancelled so
# release CI always completes instead of being interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  typedoc:
    name: Generate TypeDoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Generate TypeDoc
        run: npm run docs
        working-directory: backend

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docs
          path: docs/backend/
          retention-days: 7
