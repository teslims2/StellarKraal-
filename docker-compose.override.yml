# docker-compose.override.yml — Hot-reload development overrides
#
# This file is automatically merged with docker-compose.yml when you run
# `docker compose up`. It replaces the built images with volume mounts and
# watch-mode commands so that source changes are reflected instantly.
#
# Issue #1264 — Add hot-reload support for local development.
#
# Usage:
#   docker compose up --build
#
# To use the base file without these overrides (e.g. for staging parity):
#   docker compose -f docker-compose.yml up --build

services:
  backend:
    # Override the production command with ts-node-dev for hot reloading.
    # ts-node-dev watches src/ and restarts the server on changes.
    command: >
      sh -c "npm run migrate:dev && npx ts-node-dev --respawn --transpile-only src/index.ts"
    # Mount the source directory so edits on the host are reflected in the container.
    volumes:
      - ./backend/src:/app/src:cached
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=development
      - TS_NODE_DEV=true
    # Do not build from Dockerfile — use a Node image with devDependencies installed.
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps

  frontend:
    # Override the production start command with next dev for hot reloading.
    command: >
      sh -c "npm run dev"
    # Mount the source directory and public assets so edits are picked up immediately.
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/next.config.js:/app/next.config.js:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
