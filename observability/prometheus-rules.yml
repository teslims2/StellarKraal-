# Auto-generated by scripts/generate-alert-rules.ts — do not edit manually
groups:
  - name: stellarkraal.rules
    rules:
      - alert: HighP99Latency
        expr: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p99 HTTP latency exceeds 1s"
          description: "p99 latency is {{ $value | humanizeDuration }} over the last 5 minutes."
          runbook: "http://localhost:3000/d/stellarkraal-backend"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=HighP99Latency"
      - alert: HighErrorRate
        expr: "sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m])) > 0.01"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 1%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook: "http://localhost:3000/d/stellarkraal-backend"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=HighErrorRate"
      - alert: DbPoolExhaustion
        expr: "db_pool_available == 0"
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "DB connection pool exhausted"
          description: "All DB pool connections are in use — new queries will queue or fail."
          runbook: "http://localhost:3000/d/stellarkraal-backend"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=DbPoolExhaustion"
      - alert: RpcFailure
        expr: "stellarkraal_alert_fired{rule=\"rpc-failure\"} > 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RPC Failure"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/rpc-failure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=rpc-failure"
      - alert: RpcCircuitOpen
        expr: "stellarkraal_alert_fired{rule=\"rpc-circuit-open\"} > 0"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "RPC Circuit Breaker Opened"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/rpc-failure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=rpc-circuit-open"
      - alert: DbError
        expr: "stellarkraal_alert_fired{rule=\"db-error\"} > 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database Error"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/db-error.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=db-error"
      - alert: LiquidationFailure
        expr: "stellarkraal_alert_fired{rule=\"liquidation-failure\"} > 0"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Liquidation Engine Failure"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/liquidation-failure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=liquidation-failure"
      - alert: 5xxSpike
        expr: "stellarkraal_alert_fired{rule=\"5xx-spike\"} > 0"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "5xx Error Spike"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/5xx-spike.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=5xx-spike"
      - alert: BackupFailure
        expr: "stellarkraal_alert_fired{rule=\"backup-failure\"} > 0"
        for: 60m
        labels:
          severity: critical
        annotations:
          summary: "Database Backup Failed"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/restore-procedure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=backup-failure"
      - alert: HighContractInvocationFailureRate
        expr: "stellarkraal_alert_fired{rule=\"high-contract-invocation-failure-rate\"} > 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Contract Invocation Failure Rate"
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/contract-invocation-failure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=high-contract-invocation-failure-rate"

  # ── SLO-based alert rules ──────────────────────────────────────────────────
  # These rules fire directly against Prometheus metrics and do not rely on
  # the push-based stellarkraal_alert_fired gauge pattern. They are the
  # authoritative source for SLO breach detection.
  - name: stellarkraal.slo
    rules:
      # SLO-1: HTTP 5xx error rate must stay below 1% over any 5-minute window.
      # Threshold: >1% 5xx rate sustained for 5 minutes → critical page.
      - alert: SLO_HighErrorRate
        expr: >
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          slo: "error_rate"
        annotations:
          summary: "SLO breach: HTTP 5xx rate exceeds 1% (current: {{ $value | humanizePercentage }})"
          description: >
            The HTTP 5xx error rate has exceeded 1% for 5 consecutive minutes.
            Current rate: {{ $value | humanizePercentage }}.
            SLO target: ≤1% 5xx responses over any 5-minute window.
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/5xx-spike.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=SLO_HighErrorRate"

      # SLO-2: p99 request latency must stay below 2s over any 5-minute window.
      # Threshold: p99 > 2s sustained for 5 minutes → critical page.
      - alert: SLO_HighP99Latency
        expr: >
          histogram_quantile(
            0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: critical
          slo: "latency_p99"
        annotations:
          summary: "SLO breach: p99 request latency exceeds 2s (current: {{ $value | humanizeDuration }})"
          description: >
            The p99 HTTP request latency has exceeded 2 seconds for 5 consecutive minutes.
            Current p99: {{ $value | humanizeDuration }}.
            SLO target: p99 ≤2s over any 5-minute window.
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/high-latency.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=SLO_HighP99Latency"

      # SLO-3: Soroban contract RPC call failure rate must stay below 5%.
      # Uses stellarkraal_contract_rpc_duration_seconds (labelled by method and status).
      # Threshold: >5% error rate sustained for 5 minutes → critical page.
      - alert: SLO_ContractRpcFailureRate
        expr: >
          (
            sum(rate(stellarkraal_contract_rpc_duration_seconds_count{status="error"}[5m]))
            /
            clamp_min(sum(rate(stellarkraal_contract_rpc_duration_seconds_count[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: "contract_rpc_failure_rate"
        annotations:
          summary: "SLO breach: contract RPC failure rate exceeds 5% (current: {{ $value | humanizePercentage }})"
          description: >
            The Soroban contract RPC call failure rate has exceeded 5% for 5 consecutive minutes.
            Current rate: {{ $value | humanizePercentage }}.
            SLO target: ≤5% RPC call failures over any 5-minute window.
          runbook: "https://github.com/teslims2/StellarKraal-/blob/main/docs/runbooks/rpc-failure.md"
          dashboard: "http://localhost:3000/d/stellarkraal-backend?var-alert=SLO_ContractRpcFailureRate"
