server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_tag]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Parse the log line as JSON and extract fields.
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            requestId: requestId
            route: route
      # Promote level, requestId, and route to Loki stream labels so they can
      # be used in LogQL stream selectors, e.g.:
      #   {service="backend", level="error"}
      #   {service="backend", route="/api/v1/loans"}
      - labels:
          level:
          requestId:
          route:
      # Parse the structured timestamp so Loki stores the original log time
      # rather than the scrape time.
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - UnixMs
